<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Team Life</title>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2e1065,#0891b2);
overflow:hidden;
position:relative;
}

/* FONDO */

body::before{
content:"";
position:absolute;
width:700px;
height:700px;
background:url("img/logo.png") center no-repeat;
background-size:contain;
opacity:0.05;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

/* CARD */

.card{
position:relative;
width:95%;
max-width:420px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
text-align:center;
color:white;
}

/* LOGO */

.logo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.4);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
margin-bottom:15px;
background:white;
}

h2{
margin-bottom:25px;
font-size:28px;
}

/* INPUTS */

.input-group{
position:relative;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.18);
color:white;
font-size:15px;
}

input::placeholder{
color:#ddd;
}

/* OJO */

.eye{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
font-size:18px;
}

/* BOTONES */

button{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:15px;
font-weight:bold;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
}

.login{
background:#7F6BFF;
color:white;
}

.visitante{
background:rgba(255,255,255,0.2);
color:white;
}

/* TEXTO */

.extra{
margin-top:20px;
font-size:14px;
}

.extra a{
color:#fff;
font-weight:bold;
text-decoration:none;
}

/* LOADER */

.loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.spinner{
width:60px;
height:60px;
border:6px solid white;
border-top:6px solid #7F6BFF;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

/* RESPONSIVE */

@media(max-width:500px){

.card{
padding:30px 25px;
}

.logo{
width:120px;
height:120px;
}

}

</style>

</head>

<body>

<!-- LOADER -->

<div class="loader" id="loader">

<div class="spinner"></div>

</div>

<!-- LOGIN -->

<div class="card">

<img src="img/logo.png" class="logo">

<h2>Team Life</h2>

<input
id="phone"
type="number"
placeholder="Número de celular">

<div class="input-group">

<input
id="password"
type="password"
placeholder="Contraseña">

<span class="eye" onclick="togglePassword()">
👁
</span>

</div>

<button class="login" onclick="login()">
INGRESAR
</button>

<button class="visitante" onclick="visitante()">
Entrar como visitante
</button>

<div class="extra">

¿No tienes cuenta?

<a href="registro.html">
Registrarse
</a>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyC4eUC10DiYSAbd_ktuZ1XQIYS1xPz2SiM",

authDomain: "team-life-1d28c.firebaseapp.com",

projectId: "team-life-1d28c",

storageBucket: "team-life-1d28c.firebasestorage.app",

messagingSenderId: "61252498580",

appId: "1:61252498580:web:121a4aea2fd6236613b081",

measurementId: "G-82KVWG8QKS"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

/* VER PASSWORD */

function togglePassword(){

const input =
document.getElementById("password");

input.type =
input.type === "password"
? "text"
: "password";

}

/* LOGIN */

async function login(){

const phone =
document.getElementById("phone").value.trim();

const password =
document.getElementById("password").value;

if(!phone || !password){

alert("Completa todos los campos");
return;

}

/* LOADER */

document.getElementById("loader").style.display = "flex";

try{

/* EMAIL AUTOMÁTICO */

const email =
phone + "@gmail.com";

/* LOGIN FIREBASE */

const userCredential =
await auth.signInWithEmailAndPassword(email,password);

const user =
userCredential.user;

/* BUSCAR FIRESTORE */

const doc =
await db.collection("users")
.doc(user.uid)
.get();

/* NO EXISTE */

if(!doc.exists){

document.getElementById("loader").style.display = "none";

alert("Usuario no encontrado");

await auth.signOut();

return;

}

const data =
doc.data();

/* DEBUG */

console.log("Usuario Firebase:", user.email);

console.log("Datos Firestore:", data);

console.log("ROL:", data.role);

/* BLOQUEADO */

if(data.role === "bloqueado"){

document.getElementById("loader").style.display = "none";

alert("Cuenta bloqueada");

await auth.signOut();

return;

}

/* PENDIENTE */

if(data.role === "pendiente"){

document.getElementById("loader").style.display = "none";

alert("Tu cuenta está pendiente de aprobación");

await auth.signOut();

return;

}

/* ADMIN */

if(data.role === "admin"){

document.getElementById("loader").style.display = "none";

alert("Bienvenido administrador");

window.location.href =
"panel_admin.html";

return;

}

/* VENDEDOR */

if(data.role === "vendedor"){

document.getElementById("loader").style.display = "none";

alert("Bienvenido vendedor");

window.location.href =
"vendedor.html";

return;

}

/* OTRO */

document.getElementById("loader").style.display = "none";

window.location.href =
"tienda.html";

}catch(error){

document.getElementById("loader").style.display = "none";

console.log(error);

alert("Número o contraseña incorrectos");

}

}

/* VISITANTE */

function visitante(){

window.location.href =
"tienda.html";

}

</script>

</body>

</html>
